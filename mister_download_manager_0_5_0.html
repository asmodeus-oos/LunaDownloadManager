<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mister Download Manager 0.5.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    /* Custom subtle scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
      border: 2px solid transparent;
      background-clip: content-box;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
      border: 2px solid transparent;
      background-clip: content-box;
    }
    /* Popover smooth entrance */
    @keyframes popIn {
      from {
        opacity: 0;
        transform: translateY(-4px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .menu-popover {
      animation: popIn 0.14s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="h-screen w-screen flex items-center justify-center p-2 sm:p-4">

  <!-- Main Application Window Container -->
  <div id="app-window" class="w-full h-full max-w-[1440px] bg-slate-50/95 backdrop-blur-xl rounded-2xl shadow-2xl border border-white/80 flex flex-col overflow-hidden transition-all duration-200">

    <!-- 1. Window Title Bar -->
    <header class="h-10 px-4 bg-white border-b border-slate-200/80 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-2.5">
        <!-- Modern App Glyph Icon -->
        <div class="w-6 h-6 rounded-lg bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center text-white shadow-sm">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </div>
        <span class="text-xs font-semibold text-slate-700 tracking-tight">Mister Download Manager 0.5.0</span>
        <span class="hidden sm:inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-medium bg-emerald-50 text-emerald-700 border border-emerald-200/60">
          Modern UI
        </span>
      </div>

      <!-- Window Controls -->
      <div class="flex items-center gap-1.5">
        <button onclick="showToast('Window minimized to taskbar')" title="Minimize" class="w-8 h-7 rounded-lg hover:bg-slate-100 text-slate-500 hover:text-slate-700 flex items-center justify-center transition-colors">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
        <button onclick="toggleMaximize()" title="Maximize" class="w-8 h-7 rounded-lg hover:bg-slate-100 text-slate-500 hover:text-slate-700 flex items-center justify-center transition-colors">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="4" width="16" height="16" rx="2"/>
          </svg>
        </button>
        <button onclick="showToast('Exit requested (use Tasks > Exit)')" title="Close" class="w-8 h-7 rounded-lg hover:bg-rose-500 text-slate-500 hover:text-white flex items-center justify-center transition-colors">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- 2. Top Menu Bar (Tasks, File, Downloads, View, Help) -->
    <nav id="top-menubar" class="px-3 py-1.5 bg-white border-b border-slate-200/80 flex items-center gap-1 shrink-0 relative z-40">
      <!-- Menus are rendered dynamically by JS for clean state & hover switching -->
    </nav>

    <!-- 3. Modern Glyph Toolbar -->
    <section class="px-3 py-2.5 bg-slate-50/90 border-b border-slate-200/80 flex items-center gap-1.5 overflow-x-auto shrink-0 relative z-30">
      <!-- Add URL (Clean modern rounded glyph button - NO green square border) -->
      <button onclick="openAddUrlModal()" class="group flex flex-col items-center justify-center min-w-[72px] px-3 py-2 rounded-xl hover:bg-white hover:shadow-sm active:scale-[0.98] transition-all text-slate-700">
        <div class="w-8 h-8 rounded-xl bg-emerald-500/10 group-hover:bg-emerald-500/15 text-emerald-600 flex items-center justify-center mb-1 transition-colors">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </div>
        <span class="text-[11px] font-medium text-slate-700 whitespace-nowrap">Add URL</span>
      </button>

      <!-- Add Torrent Split-Button with Magnet Dropdown -->
      <div class="relative flex items-stretch rounded-xl hover:bg-white hover:shadow-sm transition-all group" id="torrent-split-container">
        <button onclick="openMagnetModal()" class="flex flex-col items-center justify-center min-w-[70px] pl-3 pr-2 py-2 rounded-l-xl active:scale-[0.98] transition-all">
          <div class="w-8 h-8 rounded-xl bg-indigo-500/10 group-hover:bg-indigo-500/15 text-indigo-600 flex items-center justify-center mb-1 transition-colors">
            <!-- Magnet Glyph -->
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m6 15-4-4 6.75-6.77a7.79 7.79 0 0 1 11 11L13 22l-4-4 6.39-6.36a2.14 2.14 0 0 0-3-3L6 15"/>
              <path d="m5 8 4 4"/>
              <path d="m12 15 4 4"/>
            </svg>
          </div>
          <span class="text-[11px] font-medium text-slate-700 whitespace-nowrap">Add Torrent</span>
        </button>

        <!-- Dedicated Magnet Dropdown Arrow Trigger -->
        <button id="magnet-dropdown-btn" onclick="toggleMagnetDropdown(event)" title="Torrent & Magnet Options" class="px-2 rounded-r-xl hover:bg-indigo-50/80 text-slate-500 hover:text-indigo-600 flex items-center justify-center border-l border-transparent group-hover:border-slate-200/70 transition-colors">
          <svg class="w-3.5 h-3.5 transition-transform duration-150" id="magnet-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>
      </div>

      <div class="h-9 w-[1px] bg-slate-200/80 mx-1 shrink-0"></div>

      <!-- Resume -->
      <button id="tb-resume" onclick="resumeSelected()" class="group flex flex-col items-center justify-center min-w-[68px] px-3 py-2 rounded-xl hover:bg-white hover:shadow-sm disabled:opacity-45 disabled:pointer-events-none active:scale-[0.98] transition-all">
        <div class="w-8 h-8 rounded-xl bg-sky-500/10 text-sky-600 flex items-center justify-center mb-1">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <polygon points="10 8 16 12 10 16 10 8" fill="currentColor" stroke="none"/>
          </svg>
        </div>
        <span class="text-[11px] font-medium text-slate-700 whitespace-nowrap">Resume</span>
      </button>

      <!-- Stop -->
      <button id="tb-stop" onclick="stopSelected()" class="group flex flex-col items-center justify-center min-w-[64px] px-3 py-2 rounded-xl hover:bg-white hover:shadow-sm disabled:opacity-45 disabled:pointer-events-none active:scale-[0.98] transition-all">
        <div class="w-8 h-8 rounded-xl bg-amber-500/10 text-amber-600 flex items-center justify-center mb-1">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <rect x="9" y="9" width="6" height="6" rx="1" fill="currentColor" stroke="none"/>
          </svg>
        </div>
        <span class="text-[11px] font-medium text-slate-700 whitespace-nowrap">Stop</span>
      </button>

      <!-- Stop All -->
      <button onclick="stopAllDownloads()" class="group flex flex-col items-center justify-center min-w-[68px] px-3 py-2 rounded-xl hover:bg-white hover:shadow-sm active:scale-[0.98] transition-all">
        <div class="w-8 h-8 rounded-xl bg-orange-500/10 text-orange-600 flex items-center justify-center mb-1">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/>
            <path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/>
            <path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/>
            <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>
          </svg>
        </div>
        <span class="text-[11px] font-medium text-slate-700 whitespace-nowrap">Stop All</span>
      </button>

      <div class="h-9 w-[1px] bg-slate-200/80 mx-1 shrink-0"></div>

      <!-- Delete -->
      <button id="tb-delete" onclick="removeSelected(false)" class="group flex flex-col items-center justify-center min-w-[66px] px-3 py-2 rounded-xl hover:bg-white hover:shadow-sm disabled:opacity-45 disabled:pointer-events-none active:scale-[0.98] transition-all">
        <div class="w-8 h-8 rounded-xl bg-rose-500/10 text-rose-600 flex items-center justify-center mb-1">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            <line x1="10" y1="11" x2="10" y2="17"/>
            <line x1="14" y1="11" x2="14" y2="17"/>
          </svg>
        </div>
        <span class="text-[11px] font-medium text-slate-700 whitespace-nowrap">Delete</span>
      </button>

      <!-- Delete Completed -->
      <button onclick="deleteAllCompleted()" class="group flex flex-col items-center justify-center min-w-[106px] px-3 py-2 rounded-xl hover:bg-white hover:shadow-sm active:scale-[0.98] transition-all">
        <div class="w-8 h-8 rounded-xl bg-pink-500/10 text-pink-600 flex items-center justify-center mb-1">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18"/>
            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
            <path d="m9 14 2 2 4-4"/>
          </svg>
        </div>
        <span class="text-[11px] font-medium text-slate-700 whitespace-nowrap">Delete Completed</span>
      </button>

      <div class="h-9 w-[1px] bg-slate-200/80 mx-1 shrink-0"></div>

      <!-- Options -->
      <button onclick="openOptionsModal()" class="group flex flex-col items-center justify-center min-w-[68px] px-3 py-2 rounded-xl hover:bg-white hover:shadow-sm active:scale-[0.98] transition-all">
        <div class="w-8 h-8 rounded-xl bg-violet-500/10 text-violet-600 flex items-center justify-center mb-1">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </div>
        <span class="text-[11px] font-medium text-slate-700 whitespace-nowrap">Options</span>
      </button>

      <!-- Scheduler -->
      <button onclick="openSchedulerModal()" class="group flex flex-col items-center justify-center min-w-[74px] px-3 py-2 rounded-xl hover:bg-white hover:shadow-sm active:scale-[0.98] transition-all">
        <div class="w-8 h-8 rounded-xl bg-fuchsia-500/10 text-fuchsia-600 flex items-center justify-center mb-1">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="13" r="8"/>
            <path d="M12 9v4l2 2"/>
            <path d="M5 3 2 6"/>
            <path d="m22 6-3-3"/>
          </svg>
        </div>
        <span class="text-[11px] font-medium text-slate-700 whitespace-nowrap">Scheduler</span>
      </button>

      <!-- Start Queue Split -->
      <div class="relative flex items-stretch rounded-xl hover:bg-white hover:shadow-sm transition-all group">
        <button onclick="startQueue()" class="flex flex-col items-center justify-center min-w-[72px] pl-3 pr-2 py-2 rounded-l-xl active:scale-[0.98] transition-all">
          <div class="w-8 h-8 rounded-xl bg-teal-500/10 text-teal-600 flex items-center justify-center mb-1">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="14" height="14" rx="2"/>
              <path d="M10 7v6"/>
              <path d="m7 10 3 3 3-3"/>
              <path d="M21 8v11a2 2 0 0 1-2 2H8"/>
            </svg>
          </div>
          <span class="text-[11px] font-medium text-slate-700 whitespace-nowrap">Start Queue</span>
        </button>
        <button onclick="toggleQueueDropdown(event, 'start')" class="px-1.5 rounded-r-xl hover:bg-slate-100 text-slate-400 hover:text-slate-700 flex items-center justify-center transition-colors">
          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>
      </div>

      <!-- Stop Queue Split -->
      <div class="relative flex items-stretch rounded-xl hover:bg-white hover:shadow-sm transition-all group">
        <button onclick="stopQueue()" class="flex flex-col items-center justify-center min-w-[72px] pl-3 pr-2 py-2 rounded-l-xl active:scale-[0.98] transition-all">
          <div class="w-8 h-8 rounded-xl bg-slate-500/10 text-slate-600 flex items-center justify-center mb-1">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="14" height="14" rx="2"/>
              <rect x="8" y="8" width="4" height="4" rx="0.5" fill="currentColor" stroke="none"/>
              <path d="M21 8v11a2 2 0 0 1-2 2H8"/>
            </svg>
          </div>
          <span class="text-[11px] font-medium text-slate-700 whitespace-nowrap">Stop Queue</span>
        </button>
        <button onclick="toggleQueueDropdown(event, 'stop')" class="px-1.5 rounded-r-xl hover:bg-slate-100 text-slate-400 hover:text-slate-700 flex items-center justify-center transition-colors">
          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>
      </div>
    </section>

    <!-- 4. Main Workspace (Padded Rounded Sidebar + Padded Rounded Data Table) -->
    <main class="flex-1 flex flex-col md:flex-row gap-3 p-3 overflow-hidden bg-slate-100/70">

      <!-- Left Padded Rounded Sidebar -->
      <aside id="categories-sidebar" class="w-full md:w-64 shrink-0 bg-white rounded-2xl border border-slate-200/80 shadow-sm flex flex-col overflow-hidden">
        <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
          <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">Categories</span>
          <button onclick="toggleSidebar()" title="Hide Categories" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-colors">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>

        <!-- Padded Category Tree List -->
        <div id="category-tree" class="p-2.5 space-y-1 overflow-y-auto flex-1">
          <!-- Rendered dynamically by JS -->
        </div>

        <!-- Quick Speed Limiter Status Pill inside Sidebar Bottom -->
        <div class="p-3 border-t border-slate-100 bg-slate-50/60">
          <button onclick="openSpeedLimiterModal()" class="w-full px-3 py-2 rounded-xl bg-white hover:bg-slate-50 border border-slate-200/80 shadow-2xs flex items-center justify-between text-xs transition-all">
            <span class="flex items-center gap-2 font-medium text-slate-600">
              <svg class="w-4 h-4 text-emerald-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m12 14 4-4"/>
                <path d="M3.34 19a10 10 0 1 1 17.32 0"/>
              </svg>
              Speed Limiter
            </span>
            <span id="speed-limit-badge" class="px-2 py-0.5 rounded-md bg-slate-100 text-slate-600 font-semibold text-[11px]">Off</span>
          </button>
        </div>
      </aside>

      <!-- Right Padded Rounded Data Table Card -->
      <section class="flex-1 bg-white rounded-2xl border border-slate-200/80 shadow-sm flex flex-col overflow-hidden min-w-0">
        <!-- Optional Filter / Search Banner when Find is triggered -->
        <div id="find-bar" class="hidden px-4 py-2.5 bg-slate-50 border-b border-slate-200/80 flex items-center justify-between gap-2">
          <div class="flex items-center gap-2 flex-1 max-w-md">
            <svg class="w-4 h-4 text-slate-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input id="find-input" type="text" oninput="handleFindInput(this.value)" placeholder="Filter downloads by file name..." class="w-full bg-white text-xs text-slate-700 px-3 py-1.5 rounded-lg border border-slate-200 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/15" />
            <button onclick="findNextMatch()" class="px-2.5 py-1.5 rounded-lg bg-white hover:bg-slate-100 border border-slate-200 text-xs font-medium text-slate-600 whitespace-nowrap">Find Next</button>
          </div>
          <button onclick="closeFindBar()" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-200/60">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <!-- Scrollable Table Container -->
        <div class="flex-1 overflow-auto">
          <table class="w-full text-left border-collapse min-w-[920px]">
            <thead class="sticky top-0 z-10 bg-slate-50/95 backdrop-blur-xs border-b border-slate-200/80 text-[11px] font-semibold text-slate-500 uppercase tracking-wider">
              <tr>
                <th class="py-3 pl-4 pr-3 w-24 cursor-pointer hover:text-slate-800" onclick="sortTable('source')">
                  <div class="flex items-center gap-1.5">
                    <span>Source</span>
                    <svg class="w-3 h-3 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
                  </div>
                </th>
                <th class="py-3 px-3 min-w-[240px] cursor-pointer hover:text-slate-800" onclick="sortTable('name')">
                  <div class="flex items-center justify-between">
                    <span>File Name</span>
                    <svg class="w-3 h-3 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
                  </div>
                </th>
                <th class="py-3 px-2 w-10 text-center">Q</th>
                <th class="py-3 px-3 w-28 cursor-pointer hover:text-slate-800" onclick="sortTable('sizeBytes')">
                  <div class="flex items-center justify-between">
                    <span>Size</span>
                    <svg class="w-3 h-3 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
                  </div>
                </th>
                <th class="py-3 px-3 w-36 cursor-pointer hover:text-slate-800" onclick="sortTable('status')">

    // =========================================================================
    // 4. RENDERING FUNCTIONS (Menu Bar, Popups, Sidebar, Table, Status)
    // =========================================================================
    function renderTopMenuBar() {
      const nav = document.getElementById('top-menubar');
      const menuNames = ['Tasks', 'File', 'Downloads', 'View', 'Help'];
      nav.innerHTML = menuNames.map(name => {
        const isActive = state.activeMenu === name;
        return `
          <button
            id="menu-btn-${name}"
            onclick="toggleTopMenu(event, '${name}')"
            onmouseenter="hoverTopMenu('${name}')"
            class="px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${
              isActive
                ? 'bg-emerald-500/12 text-emerald-700 font-semibold shadow-2xs'
                : 'text-slate-700 hover:bg-slate-100 hover:text-slate-900'
            }"
          >
            ${name}
          </button>
        `;
      }).join('');
    }

    function openPopupMenu(items, anchorRect, alignRight = false) {
      const layer = document.getElementById('popup-layer');
      const box = document.getElementById('popup-menu-box');

      box.innerHTML = items.map((item, idx) => {
        if (item.divider) {
          return `<div class="my-1.5 mx-2 h-[1px] bg-slate-200/80"></div>`;
        }
        const disabledClass = item.disabled
          ? 'opacity-40 pointer-events-none'
          : 'hover:bg-slate-100/90 active:bg-slate-200/70 cursor-pointer';

        return `
          <button
            onclick="executePopupAction(${idx})"
            class="w-full px-3 py-2 rounded-xl flex items-center justify-between gap-4 text-left transition-colors ${disabledClass}"
          >
            <span class="flex items-center gap-2.5">
              <span class="${item.color || 'text-slate-500'} shrink-0">${item.icon || ''}</span>
              <span class="font-medium text-slate-700 whitespace-nowrap">${item.label}</span>
            </span>
            <span class="flex items-center gap-2 shrink-0">
              ${item.checked ? `<span class="text-emerald-600">${Glyphs.check}</span>` : ''}
              ${item.shortcut ? `<span class="text-[11px] font-medium text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded-md">${item.shortcut}</span>` : ''}
            </span>
          </button>
        `;
      }).join('');

      window._currentPopupItems = items;
      layer.classList.remove('hidden');

      // Position popup cleanly below anchor
      const top = Math.min(anchorRect.bottom + 6, window.innerHeight - 420);
      let left = alignRight ? anchorRect.right - 250 : anchorRect.left;
      left = Math.max(8, Math.min(left, window.innerWidth - 280));

      box.style.top = `${top}px`;
      box.style.left = `${left}px`;
    }

    function executePopupAction(idx) {
      const items = window._currentPopupItems || [];
      const item = items[idx];
      closeAllPopups();
      if (item && !item.disabled && typeof item.action === 'function') {
        item.action();
      }
    }

    function toggleTopMenu(e, menuName) {
      e.stopPropagation();
      if (state.activeMenu === menuName) {
        closeAllPopups();
        return;
      }
      state.activeMenu = menuName;
      renderTopMenuBar();
      const btn = document.getElementById(`menu-btn-${menuName}`);
      const rect = btn.getBoundingClientRect();
      const menus = getMenuDefinitions();
      openPopupMenu(menus[menuName], rect);
    }

    function hoverTopMenu(menuName) {
      if (state.activeMenu && state.activeMenu !== menuName) {
        state.activeMenu = menuName;
        renderTopMenuBar();
        const btn = document.getElementById(`menu-btn-${menuName}`);
        const rect = btn.getBoundingClientRect();
        const menus = getMenuDefinitions();
        openPopupMenu(menus[menuName], rect);
      }
    }

    function toggleMagnetDropdown(e) {
      e.stopPropagation();
      if (state.activeMenu === 'MAGNET') {
        closeAllPopups();
        return;
      }
      state.activeMenu = 'MAGNET';
      renderTopMenuBar();
      document.getElementById('magnet-chevron').classList.add('rotate-180');
      const container = document.getElementById('torrent-split-container');
      openPopupMenu(getMagnetDropdownItems(), container.getBoundingClientRect());
    }

    function toggleQueueDropdown(e, type) {
      e.stopPropagation();
      const key = `QUEUE_${type}`;
      if (state.activeMenu === key) {
        closeAllPopups();
        return;
      }
      state.activeMenu = key;
      renderTopMenuBar();
      const rect = e.currentTarget.getBoundingClientRect();
      const items = type === 'start'
        ? [
            { label: 'Start Main Download Queue', icon: Glyphs.play, color: 'text-teal-600', action: () => startQueue() },
            { label: 'Start Synchronization Queue', icon: Glyphs.refresh, color: 'text-sky-600', action: () => showToast('Synchronization Queue started') }
          ]
        : [
            { label: 'Stop Main Download Queue', icon: Glyphs.stopCircle, color: 'text-amber-600', action: () => stopQueue() },
            { label: 'Stop All Queues', icon: Glyphs.hand, color: 'text-rose-600', action: () => stopQueue() }
          ];
      openPopupMenu(items, rect);
    }

    function closeAllPopups() {
      state.activeMenu = null;
      document.getElementById('popup-layer').classList.add('hidden');
      const chev = document.getElementById('magnet-chevron');
      if (chev) chev.classList.remove('rotate-180');
      renderTopMenuBar();
    }

    function toggleExpandNode(name) {
      state.expandedNodes[name] = !state.expandedNodes[name];
      renderSidebar();
    }

    function selectCategory(name) {
      state.activeCategory = name;
      renderSidebar();
      renderTable();
    }

    // =========================================================================
    // 6. DOWNLOADS TABLE & TOOLBAR STATE RENDERING
    // =========================================================================
    function getFilteredDownloads() {
      let list = [...downloads];

      // Filter by active category
      const cat = state.activeCategory;
      if (cat === 'Unfinished') {
        list = list.filter(d => d.status !== 'Complete');
      } else if (cat === 'Finished') {
        list = list.filter(d => d.status === 'Complete');
      } else if (cat === 'Torrents') {
        list = list.filter(d => d.category === 'Torrents' || d.source === 'Torrent');
      } else if (['Compressed', 'Documents', 'Music', 'Programs', 'Video'].includes(cat)) {
        list = list.filter(d => d.category === cat);
      }

      // Filter by Find query
      if (state.searchQuery.trim() !== '') {
        const q = state.searchQuery.toLowerCase();
        list = list.filter(d => d.name.toLowerCase().includes(q));
      }

      // Sorting
      if (state.sortField) {
        list.sort((a, b) => {
          const valA = a[state.sortField];
          const valB = b[state.sortField];
          if (valA < valB) return state.sortAsc ? -1 : 1;
          if (valA > valB) return state.sortAsc ? 1 : -1;
          return 0;
        });
      }

      return list;
    }

    function renderTable() {
      const tbody = document.getElementById('downloads-tbody');
      const visible = getFilteredDownloads();

      if (visible.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="9" class="py-16 text-center">
              <div class="flex flex-col items-center justify-center text-slate-400">
                <div class="w-12 h-12 rounded-2xl bg-slate-100 flex items-center justify-center mb-3 text-slate-400">
                  ${Glyphs.download}
                </div>
                <p class="text-sm font-medium text-slate-600">No downloads in "${state.activeCategory}"</p>
                <p class="text-xs text-slate-400 mt-1">Click "Add URL" or "Add Torrent" to start a new download.</p>
              </div>
            </td>
          </tr>
        `;
      } else {
        tbody.innerHTML = visible.map(item => {
          const isSelected = state.selectedIds.has(item.id);
          const isComplete = item.status === 'Complete';
          const isDownloading = item.status === 'Downloading';

          let statusBadge = '';
          if (isComplete) {
            statusBadge = `<span class="inline-flex items-center gap-1.5 font-medium text-slate-700">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
              Complete
            </span>`;
          } else {
            const pct = item.progress.toFixed(2);
            statusBadge = `
              <div class="flex flex-col gap-1">
                <div class="flex items-center justify-between text-[11px] font-semibold ${isDownloading ? 'text-emerald-700' : 'text-amber-700'}">
                  <span>${pct}%</span>
                  <span class="text-[10px] font-normal text-slate-400">${item.status}</span>
                </div>
                <div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden">
                  <div class="h-full rounded-full transition-all duration-300 ${isDownloading ? 'bg-emerald-500' : 'bg-amber-400'}" style="width: ${Math.min(100, Math.max(3, item.progress))}%"></div>
                </div>
              </div>
            `;
          }

          return `
            <tr
              onclick="handleRowClick(event, ${item.id})"
              oncontextmenu="handleRowContextMenu(event, ${item.id})"
              class="cursor-pointer transition-colors ${
                isSelected
                  ? 'bg-emerald-500/10 hover:bg-emerald-500/15'
                  : 'hover:bg-slate-50/90'
              }"
            >
              <td class="py-2.5 pl-4 pr-3">
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-semibold text-white shadow-2xs ${
                  item.source === 'Torrent' ? 'bg-indigo-500' : 'bg-emerald-600'
                }">
                  ${item.source}
                </span>
              </td>
              <td class="py-2.5 px-3">
                <div class="flex items-center gap-2.5">
                  ${getFileGlyph(item.name)}
                  <span class="font-medium text-slate-800 truncate max-w-[260px]" title="${item.name}">${item.name}</span>
                </div>
              </td>
              <td class="py-2.5 px-2 text-center text-slate-400 font-medium">${item.q}</td>
              <td class="py-2.5 px-3 font-medium text-slate-600 whitespace-nowrap">${item.size}</td>
              <td class="py-2.5 px-3">${statusBadge}</td>
              <td class="py-2.5 px-3 text-slate-500 whitespace-nowrap">${item.timeLeft}</td>
              <td class="py-2.5 px-3 font-medium text-slate-600 whitespace-nowrap">${item.rate}</td>
              <td class="py-2.5 px-3 text-slate-500 whitespace-nowrap">${item.lastTry}</td>
              <td class="py-2.5 pl-3 pr-4 text-slate-500 whitespace-nowrap">${item.added}</td>
            </tr>
          `;
        }).join('');
      }

      updateToolbarAndStatus();
    }

    function updateToolbarAndStatus() {
      const selectedItems = downloads.filter(d => state.selectedIds.has(d.id));
      const hasSelection = selectedItems.length > 0;
      const canResume = selectedItems.some(d => d.status !== 'Complete' && d.status !== 'Downloading');
      const canStop = selectedItems.some(d => d.status === 'Downloading');

      document.getElementById('tb-resume').disabled = !canResume;
      document.getElementById('tb-stop').disabled = !canStop;
      document.getElementById('tb-delete').disabled = !hasSelection;

      // Status bar counts
      const visible = getFilteredDownloads();
      document.getElementById('status-count').textContent = `${visible.length} download${visible.length === 1 ? '' : 's'}`;

      const selBadge = document.getElementById('selection-indicator');
      if (hasSelection) {
        selBadge.classList.remove('hidden');
        selBadge.textContent = `${selectedItems.length} selected`;
      } else {
        selBadge.classList.add('hidden');
      }

      const activeDownloads = downloads.filter(d => d.status === 'Downloading');
      const transferEl = document.getElementById('status-transfer');
      if (activeDownloads.length > 0) {
        const rateText = state.speedLimit
          ? `${(state.speedLimit / 1024).toFixed(2)} MB/sec (Limited)`
          : activeDownloads[0].rate || '1.666 MB/sec';
        transferEl.textContent = `${activeDownloads.length} downloading, ${rateText}`;
      } else {
        transferEl.textContent = '0 downloading, 0 KB/sec';
      }
    }

    // =========================================================================
    // 7. ROW SELECTION, CONTEXT MENU, AND ACTIONS
    // =========================================================================
    function handleRowClick(e, id) {
      if (e.ctrlKey || e.metaKey) {
        if (state.selectedIds.has(id)) {
          state.selectedIds.delete(id);
        } else {
          state.selectedIds.add(id);
        }
      } else {
        state.selectedIds.clear();
        state.selectedIds.add(id);
      }
      renderTable();
    }

    function handleRowContextMenu(e, id) {
      e.preventDefault();
      e.stopPropagation();
      if (!state.selectedIds.has(id)) {
        state.selectedIds.clear();
        state.selectedIds.add(id);
        renderTable();
      }
      const menus = getMenuDefinitions();
      openPopupMenu(menus.File, { left: e.clientX, bottom: e.clientY, right: e.clientX });
    }

    function selectAllRows() {
      const visible = getFilteredDownloads();
      visible.forEach(d => state.selectedIds.add(d.id));
      renderTable();
      showToast(`Selected all ${visible.length} downloads`);
    }

    function resumeSelected() {
      let count = 0;
      downloads.forEach(d => {
        if (state.selectedIds.has(d.id) && d.status !== 'Complete') {
          d.status = 'Downloading';
          d.rate = state.speedLimit ? `${(state.speedLimit / 1024).toFixed(3)} MB/sec` : '1.666 MB/sec';
          d.timeLeft = '1 hour(s) 0...';
          count++;
        }
      });
      renderSidebar();
      renderTable();
      if (count > 0) showToast(`Started ${count} download(s)`);
    }

    function stopSelected() {
      let count = 0;
      downloads.forEach(d => {
        if (state.selectedIds.has(d.id) && d.status === 'Downloading') {
          d.status = 'Stopped';
          d.rate = '';
          d.timeLeft = '';
          count++;
        }
      });
      renderSidebar();
      renderTable();
      if (count > 0) showToast(`Stopped ${count} download(s)`);
    }

    function stopAllDownloads(label = 'Stopped') {
      let count = 0;
      downloads.forEach(d => {
        if (d.status === 'Downloading') {
          d.status = label;
          d.rate = '';
          d.timeLeft = '';
          count++;
        }
      });
      renderSidebar();
      renderTable();
      showToast(`${label} all active transfers (${count})`);
    }

    function redownloadSelected() {
      downloads.forEach(d => {
        if (state.selectedIds.has(d.id)) {
          d.status = 'Downloading';
          d.progress = 0.5;
          d.rate = '2.450 MB/sec';
          d.timeLeft = '0 hour(s) 42...';
        }
      });
      renderSidebar();
      renderTable();
      showToast('Restarted selected download(s)');
    }

    function removeSelected(withFiles) {
      if (state.selectedIds.size === 0) return;
      const count = state.selectedIds.size;
      downloads = downloads.filter(d => !state.selectedIds.has(d.id));
      state.selectedIds.clear();
      renderSidebar();
      renderTable();
      showToast(withFiles ? `Removed ${count} item(s) and deleted local files` : `Removed ${count} item(s) from list`);
    }

    function deleteAllCompleted() {
      const before = downloads.length;
      downloads = downloads.filter(d => d.status !== 'Complete');
      const removed = before - downloads.length;
      state.selectedIds.clear();
      renderSidebar();
      renderTable();
      showToast(`Cleared ${removed} completed download(s)`);
    }

      state.queueRunning = true;

    function findNextMatch() {
      const visible = getFilteredDownloads();
      if (visible.length === 0) {
        openFindBar();
        return;
      }
      const currentId = [...state.selectedIds][0];
      const idx = visible.findIndex(d => d.id === currentId);
      const next = visible[(idx + 1) % visible.length];
      state.selectedIds.clear();
      state.selectedIds.add(next.id);
      renderTable();
    }

    // =========================================================================
    // 10. TOAST NOTIFICATIONS & LIVE TRANSFER SIMULATION
    // =========================================================================
    function showToast(message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'menu-popover px-4 py-2 rounded-full bg-slate-800/95 text-white text-xs font-medium shadow-lg border border-slate-700/80 flex items-center gap-2';
      toast.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span><span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.25s ease';
        setTimeout(() => toast.remove(), 260);
      }, 2400);
    }

    // Live transfer progress tick for active downloads
    setInterval(() => {
      let changed = false;
      downloads.forEach(d => {
        if (d.status === 'Downloading') {
          const speedMb = state.speedLimit ? state.speedLimit / 1024 : (1.58 + Math.random() * 0.22);
          d.rate = `${speedMb.toFixed(3)} MB/sec`;
          const step = (speedMb * 1024 * 1024 / d.sizeBytes) * 100;
          d.progress = Math.min(100, d.progress + step);
          if (d.progress >= 100) {
            d.progress = 100;
            d.status = 'Complete';
            d.rate = '';
            d.timeLeft = '';
            showToast(`Download complete: ${d.name}`);
            renderSidebar();
          }
          changed = true;
        }
      });
      if (changed) renderTable();
    }, 1000);

    // Global keyboard shortcuts (Delete, Shift+Delete, Ctrl+F, Ctrl+A, Escape)
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        closeAllPopups();
        closeModal();
      }
      if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;

      if (e.key === 'Delete') {
        e.preventDefault();
        removeSelected(e.shiftKey);
      } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
        e.preventDefault();
        openFindBar();
      } else if (e.key === 'F3') {
        e.preventDefault();
        findNextMatch();
      } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') {
        e.preventDefault();
        selectAllRows();
      }
    });

    // =========================================================================
    // 11. INITIALIZE UI
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      renderTopMenuBar();
      renderSidebar();
      renderTable();
    });
  </script>
</body>
</html>
